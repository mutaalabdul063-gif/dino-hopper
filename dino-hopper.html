<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dino Hopper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      groundY = Math.floor(H * 0.76);
      if (!player.jumping) {
        player.y = groundY - player.size;
      }
    });

    let groundY = Math.floor(H * 0.76);

    const player = {
      x: Math.max(48, Math.floor(W * 0.16)),
      y: 0,
      size: 46,
      vy: 0,
      jumping: false
    };
    player.y = groundY - player.size;

    let obstacles = [];
    let clouds = [
      { x: W * 0.2, y: H * 0.18, s: 1 },
      { x: W * 0.65, y: H * 0.25, s: 0.8 },
      { x: W * 0.95, y: H * 0.15, s: 1.1 }
    ];
    let groundOffset = 0;
    let score = 0;
    let best = Number(localStorage.getItem("dino_hopper_best") || 0);
    let speed = 5.5;
    let spawnCooldown = 70;
    let started = false;
    let gameOver = false;
    let audioCtx = null;

    function playJumpSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(640, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.11);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.11);
      } catch (e) {}
    }

    function playHitSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(170, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
      } catch (e) {}
    }

    function resetGame() {
      groundY = Math.floor(H * 0.76);
      player.y = groundY - player.size;
      player.vy = 0;
      player.jumping = false;
      obstacles = [];
      score = 0;
      speed = 5.5;
      spawnCooldown = 55;
      started = true;
      gameOver = false;
    }

    function triggerJump() {
      if (!started || gameOver) {
        resetGame();
        return;
      }
      if (!player.jumping) {
        player.vy = -14.5;
        player.jumping = true;
        playJumpSound();
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      triggerJump();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        triggerJump();
      }
    });

    function spawnObstacle() {
      const tall = Math.random() < 0.35;
      const w = tall ? 28 : 34;
      const h = tall ? 52 : 34;
      obstacles.push({
        x: W + 30,
        y: groundY - h,
        w,
        h,
        color: tall ? "#f43f5e" : "#fb923c"
      });
    }

    function drawScene() {
      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
      skyGrad.addColorStop(0, "#1e3a8a");
      skyGrad.addColorStop(1, "#7dd3fc");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, groundY);

      // Clouds
      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 18 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 16 * c.s, c.y + 3 * c.s, 14 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x - 15 * c.s, c.y + 4 * c.s, 13 * c.s, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground
      ctx.fillStyle = "#16a34a";
      ctx.fillRect(0, groundY, W, 14);
      ctx.fillStyle = "#78350f";
      ctx.fillRect(0, groundY + 14, W, H - groundY);

      // Moving ground dashes
      ctx.fillStyle = "#fde047";
      for (let x = -groundOffset; x < W; x += 44) {
        ctx.fillRect(x, groundY + 4, 22, 5);
      }

      // Player
      ctx.fillStyle = "#22c55e";
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.size, player.size, 12);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      // Eye
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(player.x + player.size * 0.68, player.y + player.size * 0.32, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(player.x + player.size * 0.72, player.y + player.size * 0.32, 2.8, 0, Math.PI * 2);
      ctx.fill();

      // Obstacles
      obstacles.forEach(ob => {
        ctx.fillStyle = ob.color;
        ctx.beginPath();
        ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 7);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Score HUD
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 24px system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE: ${score}`, 18, 42);

      ctx.font = "700 14px system-ui, sans-serif";
      ctx.fillStyle = "#fef08a";
      ctx.fillText(`BEST: ${best}`, 18, 64);

      // Start or Game Over overlay
      if (!started || gameOver) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.68)";
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = "center";
        ctx.fillStyle = gameOver ? "#fda4af" : "#fef08a";
        ctx.font = "900 32px system-ui, sans-serif";
        ctx.fillText(gameOver ? "GAME OVER" : "DINO HOPPER", W / 2, H * 0.38);

        ctx.fillStyle = "#ffffff";
        ctx.font = "700 17px system-ui, sans-serif";
        ctx.fillText(
          gameOver ? `Score: ${score}  |  Best: ${best}` : "Koodne ke liye kahin bhi TAP karo!",
          W / 2,
          H * 0.46
        );

        ctx.fillStyle = "#22c55e";
        ctx.beginPath();
        ctx.roundRect(W / 2 - 105, H * 0.52, 210, 52, 14);
        ctx.fill();

        ctx.fillStyle = "#052e16";
        ctx.font = "900 19px system-ui, sans-serif";
        ctx.fillText(gameOver ? "PLAY AGAIN" : "TAP TO START", W / 2, H * 0.52 + 33);
      }
    }

    function loop() {
      clouds.forEach(c => {
        c.x -= 0.7 * c.s;
        if (c.x < -50) c.x = W + 50;
      });

      if (started && !gameOver) {
        groundOffset = (groundOffset + speed) % 44;
        score += 1;
        if (score > best) {
          best = score;
          localStorage.setItem("dino_hopper_best", best);
        }
        speed = Math.min(13, 5.5 + score * 0.0025);

        if (player.jumping) {
          player.y += player.vy;
          player.vy += 0.72;
          if (player.y >= groundY - player.size) {
            player.y = groundY - player.size;
            player.vy = 0;
            player.jumping = false;
          }
        }

        spawnCooldown--;
        if (spawnCooldown <= 0) {
          spawnObstacle();
          spawnCooldown = Math.max(48, Math.floor(95 - speed * 3.5)) + Math.floor(Math.random() * 25);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.x -= speed;

          // Padding for fair collision
          const pad = 6;
          const hit =
            player.x + pad < ob.x + ob.w &&
            player.x + player.size - pad > ob.x &&
            player.y + pad < ob.y + ob.h &&
            player.y + player.size - pad > ob.y;

          if (hit) {
            playHitSound();
            gameOver = true;
            break;
          }

          if (ob.x + ob.w < -20) {
            obstacles.splice(i, 1);
          }
        }
      }

      drawScene();
      requestAnimationFrame(loop);
    }

    drawScene();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
